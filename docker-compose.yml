services:
  db:
    image: postgres:16-alpine
    container_name: kidslearn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kidslearn}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - kidslearn-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kidslearn}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: kidslearn-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      STAGE: production
      PORT: 9100
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-kidslearn}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET majburiy}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SEED_DEMO: ${SEED_DEMO:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SWAGGER_PATH: ${SWAGGER_PATH:-/docs}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-azure}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-westeurope}
      TTS_VOICE_UZ: ${TTS_VOICE_UZ:-uz-UZ-MadinaNeural}
      TTS_VOICE_RU: ${TTS_VOICE_RU:-ru-RU-SvetlanaNeural}
      TTS_VOICE_EN: ${TTS_VOICE_EN:-en-US-JennyNeural}
      TTS_RATE: ${TTS_RATE:--8%}
      TTS_PITCH: ${TTS_PITCH:-+4%}
      TTS_MAX_CHARS: ${TTS_MAX_CHARS:-400}
      TTS_HOURLY_BUDGET: ${TTS_HOURLY_BUDGET:-500}
    ports:
      - '${API_PORT:-9100}:9100'

  ui:
    build:
      context: ./ui
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:9100/api/v1}
    container_name: kidslearn-ui
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${UI_PORT:-3000}:3000'

volumes:
  kidslearn-pgdata:
